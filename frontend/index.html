<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Campus Event Management System</title><link rel="stylesheet" href="style.css"></head><body><header><nav class="navbar"><div class="logo">UOL Event Portal</div><ul class="nav-links"><li><a href="#">Home</a></li><li><a href="#">Events</a></li><li><a href="#">Dashboard</a></li><li><button class="btn-login">Login</button></li></ul></nav></header><main><section class="hero"><h1>Discover Campus Events</h1><p>Stay updated with seminars, workshops, and sports galas across the university</p></section><section class="controls"><input type="text" id="searchBar" placeholder="Search events..." onkeyup="filterEvents()"><select id="categoryFilter" onchange="filterEvents()"><option value="">All Categories</option><option value="Workshop">Workshops</option><option value="Sports">Sports</option><option value="Competition">Competitions</option></select></section><section class="events-container" id="eventsContainer"><!-- Event Cards are dynamically loaded here --></section></main><script>let localEvents = []; async function fetchEvents() { try { const res = await fetch('http://localhost:5000/api/events'); localEvents = await res.json(); renderEvents(localEvents); } catch (err) { console.error('Error fetching data:', err); document.getElementById('eventsContainer').innerHTML = '<p class="error">Failed to retrieve events. Make sure your server is running on port 5000.</p>'; } } function renderEvents(data) { const container = document.getElementById('eventsContainer'); container.innerHTML = ''; if(data.length === 0) { container.innerHTML = '<p>No matching events found.</p>'; return; } data.forEach(ev => { const card = document.createElement('div'); card.className = 'event-card'; card.innerHTML = `<h3>${ev.title}</h3><p class="category">${ev.category}</p><p>${ev.description}</p><p><strong>Location:</strong> ${ev.location}</p><p><strong>Date/Time:</strong> ${ev.date} at ${ev.time}</p><p><strong>Available Seats:</strong> ${ev.capacity}</p><button class="btn-register" onclick="registerEvent(${ev.id})">Register Now</button>`; container.appendChild(card); }); } function filterEvents() { const query = document.getElementById('searchBar').value.toLowerCase(); const category = document.getElementById('categoryFilter').value; const filtered = localEvents.filter(ev => { const matchesSearch = ev.title.toLowerCase().includes(query) || ev.description.toLowerCase().includes(query); const matchesCategory = category === '' || ev.category === category; return matchesSearch && matchesCategory; }); renderEvents(filtered); } async function registerEvent(eventId) { alert('Registration request sent for Event ID: ' + eventId); } window.onload = fetchEvents;</script></body></html>
